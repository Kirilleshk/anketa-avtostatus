<style>

  a { color: var(--accent-2); }

  .topbar-row { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; }

  .saved { color: #9fe3b8; font-size: 14px; white-space: nowrap; transition: opacity .3s; }

  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

  main { max-width: 720px; margin: 0 auto; padding: 18px 14px 120px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 6px 0 10px; }
  h2 { font-size: 23px; line-height: 1.25; margin: 4px 0 6px; }
  .muted { color: var(--ink-2); }
  .intro-card, .q { background: #fff; border-radius: var(--radius); padding: 18px 16px; margin: 14px 0; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .section-intro { color: var(--ink-2); margin: 0 0 6px; }
  .howto { padding-left: 1.2em; margin: 10px 0; }
  .howto li { margin-bottom: 8px; }

  .q-title { font-size: 19px; font-weight: 700; line-height: 1.35; margin: 0 0 10px; }
  .q-num { color: var(--ink-2); font-weight: 600; }
  .star { display: inline-block; background: var(--accent-soft); color: var(--accent-2); font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-bottom: 8px; }
  details.why { background: var(--soft); border-radius: 10px; margin: 0 0 12px; }
  details.why summary { cursor: pointer; padding: 10px 14px; color: var(--ink-2); font-size: 15px; font-weight: 600; list-style: none; }
  details.why summary::-webkit-details-marker { display: none; }
  details.why summary::before { content: "ⓘ "; }
  details.why[open] summary { padding-bottom: 4px; }
  details.why p { margin: 0; padding: 0 14px 12px; color: var(--ink-2); font-size: 15.5px; }
  .note { color: var(--ink-2); font-size: 15px; margin: 0 0 8px; }

  .opts { display: grid; gap: 10px; }
  .opt { position: relative; display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .mark { flex: 0 0 28px; height: 28px; border: 2px solid #9aa3ad; background: #fff; display: grid; place-items: center; }
  .opt.radio .mark { border-radius: 50%; }
  .opt.check .mark { border-radius: 7px; }
  .opt .mark::after { content: ""; width: 14px; height: 14px; transform: scale(0); transition: transform .12s; background: #fff; }
  .opt.radio .mark::after { border-radius: 50%; }
  .opt.check .mark::after { width: 16px; height: 9px; background: none; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: rotate(-45deg) scale(0); margin-top: -4px; }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .opt.on .mark { background: var(--accent); border-color: var(--accent); }
  .opt.on .mark::after { transform: scale(1); }
  .opt.check.on .mark::after { transform: rotate(-45deg) scale(1); }
  .opt:focus-within { outline: 3px solid #f2b705; outline-offset: 2px; }

  label.field { display: block; margin-top: 12px; }
  label.field > span { display: block; font-size: 15px; color: var(--ink-2); margin-bottom: 4px; }
  textarea, input[type=text], input[type=number], input[type=tel] {
    width: 100%; font-size: 17px; padding: 12px 14px; border: 2px solid #e2cf8a; border-radius: 12px; background: var(--field);
  }
  textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); background: #fff; }

  .rows { display: grid; gap: 12px; }
  .row-card { border: 2px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; }
  .row-card h4 { margin: 0 0 10px; font-size: 17px; line-height: 1.35; }
  .row-card .hint { font-size: 14.5px; color: var(--ink-2); margin: -4px 0 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg .opt { min-height: 50px; justify-content: center; padding: 8px 10px; }
  .seg .opt .mark { flex-basis: 24px; height: 24px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-add { width: 100%; margin-top: 12px; padding: 14px; border: 2px dashed #9aa3ad; border-radius: 12px; background: #fff; font-weight: 600; cursor: pointer; }
  .files { margin-top: 10px; font-size: 15px; }
  .files li { margin: 4px 0; word-break: break-all; }
  .file-btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; border: 2px solid var(--dark); border-radius: 12px; font-weight: 600; cursor: pointer; background: #fff; }
  .file-btn input { display: none; }
  .x { background: none; border: 0; color: var(--accent-2); font-size: 15px; cursor: pointer; padding: 2px 6px; }

  .navbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .navbar-row { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .btn { min-height: 56px; border-radius: 14px; border: 2px solid transparent; font-size: 18px; font-weight: 700; cursor: pointer; padding: 0 16px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { background: #e7a6a2; cursor: default; }
  .btn-ghost { background: #fff; border-color: var(--line); color: var(--ink); }
  .btn-big { width: 100%; min-height: 64px; font-size: 20px; }
  .btn-link { background: none; border: 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; font-size: 15px; padding: 8px 0; }

  .missing { list-style: none; padding: 0; margin: 10px 0 0; }
  .missing li { padding: 10px 0; border-top: 1px solid var(--line); }
  .missing button { background: none; border: 0; color: var(--accent-2); font: inherit; text-align: left; cursor: pointer; padding: 0; text-decoration: underline; }
  .status { margin-top: 14px; padding: 14px; border-radius: 12px; font-size: 16px; }
  .status.err { background: #fdeceb; color: #8c1d18; }
  .status.info { background: var(--soft); color: var(--ink-2); }
  .done-icon { width: 76px; height: 76px; border-radius: 50%; background: #e3f5ea; color: var(--ok); display: grid; place-items: center; font-size: 42px; margin: 10px auto 6px; }
  .center { text-align: center; }

  @media (min-width: 600px) {
    body { font-size: 17.5px; }
    main { padding-top: 26px; }
    .opts.cols2 { grid-template-columns: 1fr 1fr; }
  }
</style>

function isAnswered(q) {

  <p class="center"><button class="btn-link" type="button" id="download">Скачать ответы файлом</button></p>`;

function go(step, cardId) {

app.addEventListener('change', (e) => {
  const t = e.target;
  setTimeout(syncOn, 0);
  if (t.dataset.opt != null) {
    const q = findQ(t.dataset.q); const a = A(q.id); const i = +t.dataset.opt;
    if (q.multi) {
      let list = new Set(a.opts || []);
      if (t.checked) {
        if (q.opts[i].ex) list = new Set([i]);
        else q.opts.forEach((o, k) => { if (o.ex) list.delete(k); });
        list.add(i);
      } else list.delete(i);
      a.opts = [...list].sort((x, y) => x - y);
      q.opts.forEach((o, k) => { const el = app.querySelector(`input[data-q="${q.id}"][data-opt="${k}"]`); if (el) el.checked = a.opts.includes(k); });
    } else a.opt = i;
    save();
  } else if (t.dataset.path && (t.type === 'radio' || t.type === 'checkbox')) {
    set(t.dataset.path, t.type === 'radio' ? t.value : t.checked); save();
  } else if (t.dataset.file != null) {
    const i = +t.dataset.file;
    files[i] = (files[i] || []).concat([...t.files]);
    t.value = '';
    document.getElementById('files-' + i).innerHTML = fileListHtml(i);
    if (files[i].length) { set(`attach.none.${i}`, false); const cb = app.querySelector(`input[data-path="attach.none.${i}"]`); if (cb) cb.checked = false; save(); }
  }
});

  if (t.tagName === 'TEXTAREA') { t.style.height = 'auto'; t.style.height = Math.max(76, t.scrollHeight + 4) + 'px'; }
  if (t.dataset.k === 'text') { A(t.dataset.q).text = t.value; saveSoon(); }
  else if (t.dataset.path && t.type !== 'radio' && t.type !== 'checkbox') { set(t.dataset.path, t.value); saveSoon(); }
});
app.addEventListener('click', (e) => {

function now() { return new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function buildText() {
  const L = [];
  const v = (x) => (x == null || String(x).trim() === '' ? '—' : String(x).trim());

  L.push('АНКЕТА ДЛЯ РАЗРАБОТКИ САЙТА — ЧОУ ДПО ШВ «Авто-Статус»');
  L.push(`Заполнил: ${v(get('sign.fio'))}, ${v(get('sign.post'))}`);
  L.push(`Дата отправки: ${now()}`);
  const all = SECTIONS.flatMap((s) => s.q.filter((q) => q.n));
  L.push(`Отвечено: ${all.filter(isAnswered).length} из ${TOTAL_Q}`);
  SECTIONS.forEach((s, si) => {
    L.push('', '', `===== ${si + 1}. ${s.title.toUpperCase()} =====`);
    s.q.forEach((q) => {

        if (chosen.length) chosen.forEach((i) => L.push(`   [x] ${q.opts[i].t}`)); else L.push('   (вариант не выбран)');
      }
      switch (q.widget) {
        case 'programs': PROGRAMS.forEach((p, i) => L.push(`   • ${p}: ${yn(get(`q${q.n}.rows.${i}`), 'ОБУЧАЕМ', 'не обучаем')}${get(`q${q.n}.notes.${i}`) ? ` — ${get(`q${q.n}.notes.${i}`)}` : ''}`)); break;
        case 'counts': COUNT_ROWS.forEach((p, i) => L.push(`   • ${p}: обучается ${v(get(`${q.id}.total.${i}`))}, иностранцев ${v(get(`${q.id}.foreign.${i}`))}`)); break;
        case 'transfer': ['Переведено', 'Восстановлено', 'Отчислено досрочно'].forEach((l, i) => L.push(`   • ${l}: ${v(get(`${q.id}.v.${i}`))}`)); break;
        case 'finance': ['Объём платных услуг за 2025, ₽', 'Поступило за 2025, ₽', 'Израсходовано за 2025, ₽'].forEach((l, i) => L.push(`   • ${l}: ${v(get(`${q.id}.v.${i}`))}`)); break;
        case 'staff': staffList().forEach((p, i) => {

            `       образование: ${v(get(`${b}.edu`))}`, `       повышение квалификации: ${v(get(`${b}.qual`))}`, `       стаж: ${v(get(`${b}.exp`))}`);
        }); break;
        case 'cars': carList().forEach((c, i) => {
          const b = `${q.id}.cars.${i}`;
          L.push(`   • ${v(c.custom ? get(`${b}.name`) : `${c.name}, ${c.gear}`)} — ${yn(get(`${b}.used`), 'используется', 'НЕ используется')}${get(`${b}.note`) ? ` — ${get(`${b}.note`)}` : ''}`);
        }); break;
        case 'attach': ATTACH.forEach((d, i) => {
          const fl = files[i] || [];
          L.push(`• ${d}: ${fl.length ? 'прикреплено — ' + fl.map((f) => f.name).join(', ') : get(`attach.none.${i}`) ? 'нет / не нужно' : 'не прикреплено'}`);
        }); break;
        case 'sign': L.push(`ФИО: ${v(get('sign.fio'))}`, `Должность: ${v(get('sign.post'))}`); break;
      }
      if (q.text !== false && q.n) L.push(`   Комментарий: ${v(a.text)}`);
    });
  });
  return L.join('\n');
}
function fileName(ext) { return `Анкета_Авто-Статус_${new Date().toISOString().slice(0, 10)}.${ext}`; }
function download() {
  const blob = new Blob(['\uFEFF' + buildText()], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fileName('txt');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ===================== ОТПРАВКА В TELEGRAM =====================
async function tg(method, fields) {
  const fd = new FormData();
  Object.entries(fields).forEach(([k, val]) => (Array.isArray(val) ? fd.append(k, val[0], val[1]) : fd.append(k, val)));
  // FormData — «простой» запрос без предварительной проверки CORS
  const r = await fetch(`https://api.telegram.org/bot${cfg.bot}/${method}`, { method: 'POST', body: fd });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!j || !j.ok) throw new Error((j && j.description) || `ошибка ${r.status}`);
  return j;
}
async function send() {
  const btn = document.getElementById('send');
  const status = document.getElementById('sendStatus');
  const say = (html, cls = 'info') => { status.innerHTML = `<div class="status ${cls}">${html}</div>`; };
  btn.disabled = true; btn.textContent = 'Отправляем…';
  save();
  const list = [];
  ATTACH.forEach((d, i) => (files[i] || []).forEach((f) => list.push({ d, f })));
  const big = list.filter((x) => x.f.size > MAX_FILE);
  const toSend = list.filter((x) => x.f.size <= MAX_FILE);
  try {
    const all = SECTIONS.flatMap((s) => s.q.filter((q) => q.n));
    const fio = get('sign.fio') || 'не указано';
    say('Отправляем ответы…');
    await tg('sendMessage', { chat_id: cfg.chat, text: `📋 Анкета для сайта заполнена\nЧОУ ДПО ШВ «Авто-Статус»\nЗаполнил: ${fio}${get('sign.post') ? ', ' + get('sign.post') : ''}\nОтвечено: ${all.filter(isAnswered).length} из ${TOTAL_Q}\nФайлов: ${toSend.length}${big.length ? ` (ещё ${big.length} больше 50 МБ — не отправлены)` : ''}` });
    await tg('sendDocument', { chat_id: cfg.chat, caption: 'Ответы анкеты', document: [new Blob(['\uFEFF' + buildText()], { type: 'text/plain' }), fileName('txt')] });
    await tg('sendDocument', { chat_id: cfg.chat, caption: 'Ответы в JSON (для импорта)', document: [new Blob([JSON.stringify({ sentAt: now(), answers: state.a }, null, 2)], { type: 'application/json' }), fileName('json')] });
    for (let k = 0; k < toSend.length; k++) {
      say(`Отправляем документы: ${k + 1} из ${toSend.length}…`);
      await tg('sendDocument', { chat_id: cfg.chat, caption: `📎 ${toSend[k].d}`.slice(0, 1000), document: [toSend[k].f, toSend[k].f.name] });
    }
    state.sentAt = now(); save();
    go(STEPS + 2);
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Сохранить и отправить';
    const reason = /fetch|network|load failed/i.test(err.message) ? 'нет соединения с Telegram' : err.message;
    say(`Не получилось отправить автоматически (${esc(reason)}). Ваши ответы сохранены на этом устройстве. Проверьте интернет и нажмите кнопку ещё раз — или нажмите «Скачать ответы файлом» и пришлите файл Евгению в мессенджер.`, 'err');
  }
}

render();
</script>
